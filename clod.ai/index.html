.header {
    font-family: 'Bebas Neue',Arial,Helvetica,sans-serif;
    background: #222;
    background: -webkit-linear-gradient(top,#333 0%,#000 100%);
    background: linear-gradient(to bottom,#333 0%,#000 100%);
    height: 60px;
    border-bottom: 1px solid #222;
    box-shadow: 0 5px 10px #111;
    position: relative; /* Keep relative for any absolutely positioned children if needed */
    z-index: 2;

    /* --- NEW/MODIFIED FLEXBOX PROPERTIES FOR THE HEADER --- */
    display: flex; /* Make .header a flex container */

}

.header .logo {
    /* Keep existing flex, padding, font, color, etc. */
    display: flex;
    align-items: center;
    /* CHANGE: Add padding-left here */
    padding-left: 125px; /* Adjust this value as needed based on the hero logo's width */
    white-space: nowrap;
    font-family: 'Bebas Neue',Arial,Helvetica,sans-serif;
    color: #fff;
    font-size: 20px;

    /* CRITICAL: Ensure this is present and correct */
    position: relative; /* Make the logo element a positioning context for its children */
    flex-shrink: 0; /* Prevent logo from shrinking to ensure space-between works */
    flex-basis: auto; /* Ensure logo takes its natural width */

    /* Ensure a.logo matches the header's height, or its content aligns properly */
    height: 60px; /* Explicitly set height to match the header, overriding 100% if needed */
    line-height: 60px; /* This helps vertically align the text content "Marinara Timer by" */
}

.header .logo:before {
    content: '';
    /* REMOVE display: block; -- it's not needed for absolutely positioned elements in this context */

    background: transparent url(https://web.archive.org/web/20170104231649im_/http://www.marinaratimer.com/Content/img/logo.png) no-repeat 0 0;
    width: 148px;
    height: 156px; /* Intrinsic height */

    /* Keep the scaling transform */
    -webkit-transform: scale(-.6,.6);
    -ms-transform: scale(-.6,.6);
    transform: scale(-.7,.7);

    -webkit-transform-origin: 40% 0; /* Scaling origin remains top-center */
    -ms-transform-origin: 40% 0;
    transform-origin: 40% 0;

    /* CRITICAL: Correct absolute positioning */
    position: absolute;
    top: 1.0px; /* This calculation should position the top of the logo 15.5px ABOVE the top of a.logo */
    left: 16.0px; /* Align left with the start of a.logo */

    /* REMOVE THIS: margin-right: 10px; as it's absolutely positioned */
}

.header .logo:after {
    content: '';
    display: block; /* Keep as display: block so it respects width/height within flex container */
    background: transparent url(https://web.archive.org/web/20170104231649im_/http://www.marinaratimer.com/Content/img/logo-tiny.png) no-repeat 0 0;

    transform: scale(.5);
    -webkit-transform-origin: 0 0;
    -ms-transform-origin: 0 0;
    transform-origin: 0 0;
    margin-left: .3em; /* Keep existing margin for spacing */
    margin-top: 1.5em;
}
